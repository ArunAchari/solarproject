<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sun Earth Moon</title>

    <style>

        body {
            margin: 0;
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden;
        }

        h1 {
            margin: 10px;
        }

        /* Button */

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;

            border: none;
            border-radius: 5px;
	    margin-left:950px;
            margin-bottom:0px;
        }

        /* Space */

        .space {
            width: 600px;
            height: 500px;

            margin: auto;

            position: relative;
        }

        /* Sun */

        .sun {
            position: absolute;

            top: 200px;
            left: 250px;

            width: 100px;
            height: 100px;

            background-color: orange;

            border-radius: 50%;

            box-shadow: 0 0 40px yellow;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 50px;
        }

        /* Earth Orbit */

        .earth-orbit {
            position: absolute;

            width: 450px;
            height: 450px;

            top: 25px;
            left: 75px;

            border: 1px dashed gray;

            border-radius: 50%;

            animation: earthOrbit 8s linear infinite;
        }

        /* Earth */

        .earth {
            position: absolute;

            top: -25px;
            left: 195px;

            width: 50px;
            height: 50px;

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 40px;
        }

        /* Moon Orbit */

        .moon-orbit {
            position: absolute;

            width: 100px;
            height: 100px;

            top: -25px;
            left: -25px;

            border: 1px dashed white;

            border-radius: 50%;

            animation: moonOrbit 3s linear infinite;
        }

        /* Moon */

        .moon {
            position: absolute;

            top: -12px;
            left: 35px;

            font-size: 25px;
        }

        /* Earth Animation */

        @keyframes earthOrbit {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }

        /* Moon Animation */

        @keyframes moonOrbit {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }

    </style>

</head>


<body>

    <h1>🌞 Sun - 🌍 Earth - 🌙 Moon</h1>


    <!-- BUTTON -->

    <button onclick="changeBackground()">

        Change Background

    </button>


    <!-- SOLAR SYSTEM -->

    <div class="space">

        <!-- SUN -->

        <div class="sun">

            🌞

        </div>


        <!-- EARTH ORBIT -->

        <div class="earth-orbit">

            <!-- EARTH -->

            <div class="earth">

                🌍


                <!-- MOON ORBIT -->

                <div class="moon-orbit">

                    <!-- MOON -->

                    <div class="moon">

                        🌙

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script>

        function changeBackground() {

            if (document.body.style.backgroundColor === "black") {

                document.body.style.backgroundColor = "#07152e";

            }

            else {

                document.body.style.backgroundColor = "black";

            }

        }

    </script>


</body>

</html>
